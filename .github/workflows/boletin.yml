name: Buscar boletines Valle de Tobalina

on:
  schedule:
    - cron: "0 8 * * *"  # Todos los días a las 08:00 UTC
  workflow_dispatch:     # Permite ejecutarlo manualmente

jobs:
  buscar:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Instalar dependencias
      run: pip install requests PyPDF2

    - name: Ejecutar script de búsqueda
      env:
        EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
        EMAIL_REMITENTE: ${{ secrets.EMAIL_REMITENTE }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      run: python main.py
